<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevBoard — Task Manager for Developers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="noise"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&gt;_</span>
      <span class="brand-name">DevBoard</span>
    </div>
    <div class="topbar-actions">
      <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle dark/light theme">
        <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">

    <!-- Stats strip -->
    <section class="stats" id="statsStrip">
      <div class="stat">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-label">total_tasks</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statProgress">0</span>
        <span class="stat-label">in_progress</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statDone">0</span>
        <span class="stat-label">completed</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statStreak">0</span>
        <span class="stat-label">day_streak</span>
      </div>
    </section>

    <!-- Activity heatmap: the signature element -->
    <section class="heatmap-card">
      <div class="heatmap-head">
        <h2>commit_history<span class="cursor">_</span></h2>
        <p id="heatmapSub">Every square is a day you shipped something.</p>
      </div>
      <div class="heatmap-scroll">
        <div id="heatmap" class="heatmap"></div>
      </div>
      <div class="heatmap-legend">
        <span>less</span>
        <span class="lvl lvl-0"></span>
        <span class="lvl lvl-1"></span>
        <span class="lvl lvl-2"></span>
        <span class="lvl lvl-3"></span>
        <span class="lvl lvl-4"></span>
        <span>more</span>
      </div>
    </section>

    <!-- Controls -->
    <section class="controls">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="search tasks..." />
      </div>
      <div class="filter-wrap" id="priorityFilters">
        <button class="filter-chip active" data-priority="all">all</button>
        <button class="filter-chip" data-priority="high">high</button>
        <button class="filter-chip" data-priority="medium">medium</button>
        <button class="filter-chip" data-priority="low">low</button>
      </div>
      <button id="addTaskBtn" class="btn-primary">+ new task</button>
    </section>

    <!-- Board -->
    <section class="board">
      <div class="column" data-status="todo">
        <div class="column-head">
          <span class="dot dot-todo"></span>
          <h3>To Do</h3>
          <span class="count" id="countTodo">0</span>
        </div>
        <div class="column-body" id="col-todo" data-status="todo"></div>
      </div>

      <div class="column" data-status="progress">
        <div class="column-head">
          <span class="dot dot-progress"></span>
          <h3>In Progress</h3>
          <span class="count" id="countProgress">0</span>
        </div>
        <div class="column-body" id="col-progress" data-status="progress"></div>
      </div>

      <div class="column" data-status="done">
        <div class="column-head">
          <span class="dot dot-done"></span>
          <h3>Done</h3>
          <span class="count" id="countDone">0</span>
        </div>
        <div class="column-body" id="col-done" data-status="done"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>DevBoard — built with plain HTML, CSS &amp; JavaScript. No frameworks, no dependencies.</p>
  </footer>

  <!-- Add/Edit Task Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">New Task</h3>
        <button class="icon-btn" id="closeModal" aria-label="Close">&times;</button>
      </div>
      <form id="taskForm">
        <label>
          Title
          <input type="text" id="taskTitle" required maxlength="80" placeholder="e.g. Implement JWT auth" />
        </label>
        <label>
          Description <span class="optional">(optional)</span>
          <textarea id="taskDesc" rows="3" maxlength="240" placeholder="Short notes..."></textarea>
        </label>
        <div class="form-row">
          <label>
            Priority
            <select id="taskPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label>
            Due date <span class="optional">(optional)</span>
            <input type="date" id="taskDue" />
          </label>
        </div>
        <input type="hidden" id="taskId" />
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="deleteTaskBtn" style="display:none;">Delete</button>
          <div class="modal-actions-right">
            <button type="button" class="btn-ghost" id="cancelModal">Cancel</button>
            <button type="submit" class="btn-primary">Save task</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
